name: Refresh intel feed

on:
  schedule:
    - cron: "17 21 * * *"   # 21:17 UTC, 05:17 in Perth; off the top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: intel-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the feeds and render the page
        id: fetch
        continue-on-error: true
        env:
          INTEL_FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 .github/scripts/fetch_intel.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain -- intel/feed.json intel/index.html)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/feed.json intel/index.html
          git commit -q -m "Refresh intel feed"
          git pull -q --rebase origin main
          git push -q origin main

      - name: Report a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_intel.py exited non-zero; see the fetch step log."
          exit 1
